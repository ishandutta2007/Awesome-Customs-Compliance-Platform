<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.03); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { stop-color: #6366F1; }
      50% { stop-color: #06B6D4; }
      100% { stop-color: #EC4899; }
    }
    .bg-animate { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .flow-line { stroke-dasharray: 12 8; animation: dashMove 15s linear infinite; }
    .hero-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 42px; letter-spacing: -0.5px; }
    .hero-subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94A3B8; font-size: 19px; letter-spacing: 0.2px; }
    .pill-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
    .badge-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #38BDF8; }
  </style>

  <!-- Base Dark Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Glow Spheres in Background -->
  <circle cx="150" cy="100" r="140" fill="#6366F1" opacity="0.18" class="bg-animate" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="160" fill="#06B6D4" opacity="0.15" class="bg-animate" filter="url(#glow)" />
  <circle cx="900" cy="80" r="120" fill="#EC4899" opacity="0.12" class="bg-animate" filter="url(#glow)" />

  <!-- Flow Diagrams / Connections (Background Grid Lines) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="340" x2="1100" y2="340" />
    <line x1="100" y1="60" x2="1100" y2="60" />
  </g>

  <path d="M 120 330 Q 300 280 480 330 T 840 330 T 1080 330" fill="none" stroke="url(#cyanGrad)" stroke-width="2" class="flow-line" opacity="0.6" />
  <path d="M 150 70 Q 400 120 650 70 T 1050 70" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="flow-line" opacity="0.5" />

  <!-- Background Decorative Tech Pills & Cards (Positioned lower/side so they don't cover text) -->
  <!-- Left Side Badges / Cards -->
  <g class="particle-1" transform="translate(60, 290)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#10B981" />
    <text x="42" y="26" class="pill-text">Harmonized Tariff (HS)</text>
  </g>

  <g class="particle-2" transform="translate(260, 290)">
    <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#6366F1" />
    <text x="42" y="26" class="pill-text">Denied Party Screening</text>
  </g>

  <!-- Right Side Badges / Cards -->
  <g class="particle-1" transform="translate(730, 290)">
    <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#06B6D4" />
    <text x="42" y="26" class="pill-text">Customs Declarations</text>
  </g>

  <g class="particle-2" transform="translate(940, 290)">
    <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="10" fill="#EC4899" />
    <text x="42" y="26" class="pill-text">Global Trade Mgmt</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Main Title, Subtitle, & Tech Stack Ribbon -->
  <!-- Top Category Tag -->
  <g transform="translate(480, 55)">
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="120" y="21" text-anchor="middle" class="badge-label">🌐 GLOBAL TRADE &amp; REGTECH</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" class="hero-title" filter="url(#softGlow)">
    Awesome Customs Compliance Platform
  </text>

  <!-- Title Underline Gradient Bar -->
  <rect x="420" y="165" width="360" height="4" rx="2" fill="url(#primaryGrad)" />

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" class="hero-subtitle">
    Curated SaaS Platforms, Open-Source Repos &amp; Regulatory Trade Infrastructure
  </text>

  <!-- Decorative Globe / Shield Motif Icons in Foreground Center Top -->
  <g transform="translate(60, 50)" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.7">
    <circle cx="24" cy="24" r="20" />
    <path d="M 4 24 H 44 M 24 4 A 28 28 0 0 1 24 44 A 28 28 0 0 1 24 4" />
  </g>

  <g transform="translate(1090, 50)" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.7">
    <path d="M 20 4 L 36 12 V 24 C 36 34 20 42 20 42 C 20 42 4 34 4 24 V 12 L 20 4 Z" />
  </g>

</svg>
